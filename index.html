    />

    <!-- 1. Script síncrono anti-flash: aplica la clase 'dark' inmediatamente antes del primer pintado -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (!stored && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- 2. CSS crítico inline: define los fondos iniciales en el HTML para evitar que el navegador pinte blanco mientras carga el JS -->
    <style>
      html {
        background-color: #f3ecfc;
        color: #291b48;
      }
      html.dark {
        background-color: #1d1233;
        color: #e5d8f9;
      }
      body {
        margin: 0;
        background-color: inherit;
        color: inherit;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
